<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestionar Mascotas | Admin</title>
    <link rel="stylesheet" href="../css/estilos-generales.css" />
    <link rel="stylesheet" href="css/admin-styles.css" />
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="sidebar-logo">
                <img src="../assets/images/Logos/Logo patitas felices (9).png" alt="Patitas Felices" />
                <span>Admin Panel</span>
            </div>
            
            <nav class="sidebar-nav">
                <a href="index.html">Dashboard</a>
                <a href="mascotas.html" class="activo">Mascotas</a>
                <a href="solicitudes.html">Solicitudes</a>
                <a href="usuarios.html">Usuarios</a>
                <hr>
                <a href="../index.html">Ver sitio</a>
            </nav>
        </aside>

        <main class="admin-contenido">
            <div class="admin-header">
                <h1>Gestión de Mascotas</h1>
                <a href="mascota-nueva.html" class="tarjeta-icono">
                    <img src="../assets/icons/add.svg" alt="Nueva" />
                    
                </a>
            </div>

            <div class="filtros-avanzados">
                <input type="text" id="buscar" placeholder="Buscar por nombre...">
                <select id="filtroEspecie">
                    <option value="">Todas las especies</option>
                    <option value="perro">Perros</option>
                    <option value="gato">Gatos</option>
                </select>
                <select id="filtroEstado">
                    <option value="">Todos los estados</option>
                    <option value="disponible">Disponible</option>
                    <option value="proceso">En proceso</option>
                    <option value="adoptado">Adoptado</option>
                </select>
                <button onclick="aplicarFiltros()" class="btn-accion">Filtrar</button>
            </div>

            <table class="tabla-admin">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Especie</th>
                        <th>Edad</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaMascotas">
                    <tr><td colspan="5" class="cargando">Cargando mascotas...</td></tr>
                </tbody>
            </table>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="js/admin-mascotas.js"></script>
</body>
</html>
