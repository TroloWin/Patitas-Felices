<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Panel Admin</title>
    <link rel="stylesheet" href="../css/estilos-generales.css" />
    <link rel="stylesheet" href="css/admin-styles.css" />
    <style>
        /* Estilos adicionales para mantener consistencia */
        .admin-header {
            margin-bottom: 30px;
        }
        
        .dashboard-tarjetas {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .tarjeta-resumen {
            background: white;
            border: 2px solid var(--color-borde);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s;
        }
        
        .tarjeta-resumen:hover {
            transform: translateY(-3px);
            box-shadow: var(--sombra);
            border-color: var(--color-primario);
        }
        
        .tarjeta-icono {
            width: 50px;
            height: 50px;
            background: var(--color-primario-claro);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .tarjeta-icono img {
            width: 30px;
            height: 30px;
        }
        
        .tarjeta-info h3 {
            color: var(--color-texto-claro);
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        
        .numero {
            font-size: 2rem;
            font-weight: bold;
            color: var(--color-primario-oscuro);
            line-height: 1;
        }
        
        .acciones-rapidas {
            background: white;
            border: 2px solid var(--color-borde);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .acciones-rapidas h2 {
            color: var(--color-primario-oscuro);
            font-size: 1.2rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--color-primario-claro);
        }
        
        .botones-accion {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        
        .btn-accion {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            background: var(--color-primario-claro);
            border: 2px solid transparent;
            border-radius: 10px;
            color: var(--color-primario-oscuro);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .btn-accion:hover {
            background: var(--color-primario);
            border-color: var(--color-primario-oscuro);
            color: white;
        }
        
        .btn-accion:hover img {
            filter: brightness(0) invert(1);
        }
        
        .btn-accion img {
            width: 20px;
            height: 20px;
        }
        
        .actividad-reciente {
            background: white;
            border: 2px solid var(--color-borde);
            border-radius: 10px;
            padding: 20px;
        }
        
        .actividad-reciente h2 {
            color: var(--color-primario-oscuro);
            font-size: 1.2rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--color-primario-claro);
        }
        
        .recientes-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .recientes-card {
            background: #f8f9fa;
            border: 2px solid var(--color-borde);
            border-radius: 10px;
            padding: 15px;
        }
        
        .recientes-card h3 {
            color: var(--color-primario-oscuro);
            font-size: 1rem;
            margin-bottom: 15px;
        }
        
        .lista-recientes {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        
        .item-reciente {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid var(--color-borde);
            transition: background 0.3s;
        }
        
        .item-reciente:hover {
            background: var(--color-primario-claro);
        }
        
        .item-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .item-info strong {
            color: var(--color-texto);
            font-size: 0.95rem;
        }
        
        .item-info small {
            color: var(--color-texto-claro);
            font-size: 0.8rem;
        }
        
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
        }
        
        .badge.disponible,
        .badge-pendiente {
            background: #fff3cd;
            color: #856404;
        }
        
        .badge.proceso,
        .badge-aprobada {
            background: #d4edda;
            color: #155724;
        }
        
        .badge.adoptado,
        .badge-rechazada {
            background: #f8d7da;
            color: #721c24;
        }
        
        .ver-todas {
            display: inline-block;
            color: var(--color-primario);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            margin-top: 10px;
        }
        
        .ver-todas:hover {
            text-decoration: underline;
        }
        
        .cargando {
            text-align: center;
            padding: 20px;
            color: var(--color-texto-claro);
        }

        /* Corrección de iconos */
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            transition: all 0.3s;
            margin: 4px 10px;
            border-radius: 8px;
        }

        .sidebar-nav a img {
            width: 20px;
            height: 20px;
            filter: brightness(0) invert(1);
        }

        .admin-info img {
            width: 24px;
            height: 24px;
            filter: brightness(0) invert(1);
        }

        .btn-cerrar {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .btn-cerrar img {
            width: 18px;
            height: 18px;
            filter: brightness(0) invert(1);
        }
        
        @media (max-width: 768px) {
            .dashboard-tarjetas {
                grid-template-columns: 1fr;
            }
            
            .botones-accion {
                grid-template-columns: 1fr;
            }
            
            .recientes-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <!-- SIDEBAR - Menú lateral -->
        <aside class="admin-sidebar">
            <div class="sidebar-logo">
                <img src="../assets/images/Logo patitas felices (7).png" alt="Patitas Felices" />
                <span>Admin Panel</span>
            </div>
            
            <nav class="sidebar-nav">
                <a href="index.html" class="activo">
                    Dashboard
                </a>
                <a href="mascotas.html">
                    Mascotas
                </a>
                <a href="solicitudes.html">
                    Solicitudes
                </a>
                <a href="usuarios.html">
                    Usuarios
                </a>
                <hr>
                <a href="../index.html">
                    Ver sitio
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <div class="admin-info">
                    <img src="../assets/icons/admin.svg" alt="Admin" />
                    <div>
                        <span id="adminNombre">Cargando...</span>
                        <small>Administrador</small>
                    </div>
                </div>
                <button onclick="cerrarSesion()" class="btn-cerrar">
                    <img src="../assets/icons/logout.svg" alt="Salir" />
                    Cerrar sesión
                </button>
            </div>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="admin-contenido">
            <!-- Header con título y fecha -->
            <div class="admin-header">
                <h1>Dashboard</h1>
                <div class="header-fecha" id="fechaActual"></div>
            </div>

            <!-- Tarjetas de resumen -->
            <div class="dashboard-tarjetas">
                <!-- Tarjeta: Total Mascotas -->
                <div class="tarjeta-resumen">
                    <div class="tarjeta-icono">
                        <img src="../assets/icons/pets.svg" alt="Mascotas" />
                    </div>
                    <div class="tarjeta-info">
                        <h3>Total Mascotas</h3>
                        <span class="numero" id="totalMascotas">0</span>
                    </div>
                </div>

                <!-- Tarjeta: Solicitudes Pendientes -->
                <div class="tarjeta-resumen">
                    <div class="tarjeta-icono">
                        <img src="../assets/icons/requests.svg" alt="Solicitudes" />
                    </div>
                    <div class="tarjeta-info">
                        <h3>Solicitudes Pendientes</h3>
                        <span class="numero" id="solicitudesPendientes">0</span>
                    </div>
                </div>

                <!-- Tarjeta: Usuarios Activos -->
                <div class="tarjeta-resumen">
                    <div class="tarjeta-icono">
                        <img src="../assets/icons/users.svg" alt="Usuarios" />
                    </div>
                    <div class="tarjeta-info">
                        <h3>Usuarios Activos</h3>
                        <span class="numero" id="usuariosActivos">0</span>
                    </div>
                </div>

                <!-- Tarjeta: Administradores -->
                <div class="tarjeta-resumen">
                    <div class="tarjeta-icono">
                        <img src="../assets/icons/admin.svg" alt="Administradores" />
                    </div>
                    <div class="tarjeta-info">
                        <h3>Administradores</h3>
                        <span class="numero" id="totalAdmins">0</span>
                    </div>
                </div>
            </div>

            <!-- ACTIVIDAD RECIENTE -->
            <div class="actividad-reciente">
                <h2>Actividad reciente</h2>
                
                <div class="recientes-grid">
                    <!-- Últimas mascotas -->
                    <div class="recientes-card">
                        <h3>Últimas mascotas</h3>
                        <div id="ultimasMascotas" class="lista-recientes">
                            <p class="cargando">Cargando...</p>
                        </div>
                        <a href="mascotas.html" class="ver-todas">Ver todas →</a>
                    </div>

                    <!-- Últimas solicitudes -->
                    <div class="recientes-card">
                        <h3>Últimas solicitudes</h3>
                        <div id="ultimasSolicitudes" class="lista-recientes">
                            <p class="cargando">Cargando...</p>
                        </div>
                        <a href="solicitudes.html" class="ver-todas">Ver todas →</a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <!-- Configuración -->
    <script src="../js/firebase-config.js"></script>
    <script src="../js/auth.js"></script>
    
    <script>
        // Verificar autenticación y rol de admin
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = '../login/login.html';
                return;
            }

            const userDoc = await db.collection('usuarios').doc(user.uid).get();
            const userData = userDoc.data();

            if (!userData?.esAdmin) {
                window.location.href = '../index.html';
                return;
            }

            // Mostrar nombre del admin
            document.getElementById('adminNombre').textContent = userData.nombre || 'Admin';
            
            // Mostrar fecha actual
            const fecha = new Date();
            document.getElementById('fechaActual').textContent = fecha.toLocaleDateString('es-ES', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            // Cargar todas las estadísticas
            await Promise.all([
                cargarEstadisticas(),
                cargarUltimasMascotas(),
                cargarUltimasSolicitudes()
            ]);
        });

        // Función para cargar estadísticas
        async function cargarEstadisticas() {
            try {
                // Total mascotas
                const mascotasSnap = await db.collection('mascotas').get();
                document.getElementById('totalMascotas').textContent = mascotasSnap.size;

                // Solicitudes pendientes
                const solicitudesSnap = await db.collection('solicitudes')
                    .where('estado', '==', 'pendiente')
                    .get();
                document.getElementById('solicitudesPendientes').textContent = solicitudesSnap.size;

                // Usuarios activos
                const usuariosSnap = await db.collection('usuarios')
                    .where('activo', '==', true)
                    .get();
                document.getElementById('usuariosActivos').textContent = usuariosSnap.size;

                // Total admins
                const adminsSnap = await db.collection('usuarios')
                    .where('esAdmin', '==', true)
                    .get();
                document.getElementById('totalAdmins').textContent = adminsSnap.size;

            } catch (error) {
                console.error('Error cargando estadísticas:', error);
            }
        }

        // Función para cargar últimas mascotas
        async function cargarUltimasMascotas() {
            try {
                const snapshot = await db.collection('mascotas')
                    .orderBy('fechaRegistro', 'desc')
                    .limit(5)
                    .get();

                const container = document.getElementById('ultimasMascotas');
                
                if (snapshot.empty) {
                    container.innerHTML = '<p class="sin-resultados">No hay mascotas registradas</p>';
                    return;
                }

                container.innerHTML = snapshot.docs.map(doc => {
                    const mascota = doc.data();
                    const fecha = mascota.fechaRegistro ? 
                        new Date(mascota.fechaRegistro.toDate()).toLocaleDateString() : 
                        'Fecha desconocida';
                    
                    let badgeClass = '';
                    if (mascota.estado === 'disponible') badgeClass = 'disponible';
                    else if (mascota.estado === 'proceso') badgeClass = 'proceso';
                    else if (mascota.estado === 'adoptado') badgeClass = 'adoptado';
                    
                    return `
                        <div class="item-reciente">
                            <div class="item-info">
                                <strong>${mascota.nombre}</strong>
                                <small>${mascota.especie} • ${fecha}</small>
                            </div>
                            <span class="badge ${badgeClass}">${mascota.estado}</span>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('Error cargando últimas mascotas:', error);
                document.getElementById('ultimasMascotas').innerHTML = '<p class="error">Error al cargar</p>';
            }
        }

        // Función para cargar últimas solicitudes
        async function cargarUltimasSolicitudes() {
            try {
                const snapshot = await db.collection('solicitudes')
                    .orderBy('fechaSolicitud', 'desc')
                    .limit(5)
                    .get();

                const container = document.getElementById('ultimasSolicitudes');
                
                if (snapshot.empty) {
                    container.innerHTML = '<p class="sin-resultados">No hay solicitudes</p>';
                    return;
                }

                container.innerHTML = snapshot.docs.map(doc => {
                    const solicitud = doc.data();
                    const fecha = solicitud.fechaSolicitud ? 
                        new Date(solicitud.fechaSolicitud.toDate()).toLocaleDateString() : 
                        'Fecha desconocida';
                    
                    let badgeClass = '';
                    if (solicitud.estado === 'pendiente') badgeClass = 'badge-pendiente';
                    else if (solicitud.estado === 'aprobada') badgeClass = 'badge-aprobada';
                    else if (solicitud.estado === 'rechazada') badgeClass = 'badge-rechazada';
                    
                    return `
                        <div class="item-reciente">
                            <div class="item-info">
                                <strong>${solicitud.adoptante?.nombre || 'Usuario'}</strong>
                                <small>${solicitud.mascota?.nombre || 'Mascota'} • ${fecha}</small>
                            </div>
                            <span class="badge ${badgeClass}">${solicitud.estado}</span>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('Error cargando últimas solicitudes:', error);
                document.getElementById('ultimasSolicitudes').innerHTML = '<p class="error">Error al cargar</p>';
            }
        }

        // Función para cerrar sesión
        function cerrarSesion() {
            auth.signOut().then(() => {
                window.location.href = '../index.html';
            });
        }
    </script>
</body>
</html>
