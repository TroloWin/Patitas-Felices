<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestionar Solicitudes | Admin</title>
    <link rel="stylesheet" href="../css/estilos-generales.css" />
    <link rel="stylesheet" href="css/admin-styles.css" />
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="sidebar-logo">
                <img src="../assets/images/Logo patitas felices (9).png" alt="Patitas Felices" />
                <span>Admin Panel</span>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html">Dashboard</a>
                <a href="mascotas.html">Mascotas</a>
                <a href="solicitudes.html" class="activo">Solicitudes</a>
                <a href="usuarios.html">Usuarios</a>
                <hr>
                <a href="../index.html">Ver sitio</a>
            </nav>
        </aside>

        <main class="admin-contenido">
            <div class="admin-header">
                <h1>Gestión de Solicitudes</h1>
            </div>

            <div class="filtros-avanzados">
                <select id="filtroEstado">
                    <option value="todos">Todas</option>
                    <option value="pendiente">Pendientes</option>
                    <option value="aprobada">Aprobadas</option>
                    <option value="rechazada">Rechazadas</option>
                </select>
                <button onclick="cargarSolicitudes()" class="btn-accion">Filtrar</button>
            </div>

            <div id="solicitudesContainer">
                <p class="cargando">Cargando solicitudes...</p>
            </div>
        </main>
    </div>

    <div id="modalRechazar" class="modal">
        <div class="modal-contenido">
            <h3>Rechazar solicitud</h3>
            <p>Motivo del rechazo:</p>
            <textarea id="motivoRechazo" rows="3"></textarea>
            <div class="modal-botones">
                <button onclick="cerrarModal()" class="btn-accion">Cancelar</button>
                <button onclick="confirmarRechazo()" class="btn-accion">Rechazar</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/solicitudes.js"></script>
    <script src="js/admin-solicitudes.js"></script>
</body>
</html>
