<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestionar Usuarios | Admin</title>
    <link rel="stylesheet" href="../css/estilos-generales.css" />
    <link rel="stylesheet" href="css/admin-styles.css" />
    <style>
        /* Estilo para el botón regresar (igual al de filtrar) */
        .btn-regresar {
            display: inline-block;
            padding: 8px 15px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.95rem;
            margin-right: 15px;
            border: none;
            cursor: pointer;
        }
        
        .btn-regresar:hover {
            background-color: #5a6268;
        }
        
        .admin-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="sidebar-logo">
                <img src="../assets/images/Logos/Logo patitas felices (11).png" alt="Patitas Felices" />
                <span>Panel de Administración</span>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html">Dashboard</a>
                <a href="mascotas.html">Mascotas</a>
                <a href="solicitudes.html">Solicitudes</a>
                <a href="usuarios.html" class="activo">Usuarios</a>
                <hr>
                <a href="../adoptar.html">Ver sitio</a>
            </nav>
        </aside>

        <main class="admin-contenido">
            <div class="admin-header">
                <a href="solicitudes.html" class="btn-regresar">← Regresar</a>
                <h1>Gestión de Usuarios</h1>
            </div>

            <div class="filtros-avanzados">
                <input type="text" id="buscar" placeholder="Buscar por nombre o email...">
                <select id="filtroTipo">
                    <option value="">Todos</option>
                    <option value="admin">Administradores</option>
                    <option value="adoptante">Adoptantes</option>
                </select>
                <select id="filtroEstado">
                    <option value="">Todos</option>
                    <option value="activo">Activos</option>
                    <option value="inactivo">Inactivos</option>
                </select>
                <button onclick="aplicarFiltros()" class="btn-accion">Filtrar</button>
            </div>

            <table class="tabla-admin">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Tipo</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaUsuarios">
                    <tr><td colspan="5" class="cargando">Cargando usuarios...</td></tr>
                </tbody>
            </table>
        </main>
    </div>

    <div id="modalConfirmar" class="modal">
        <div class="modal-contenido">
            <h3 id="modalTitulo">Confirmar acción</h3>
            <p id="modalMensaje">¿Estás seguro de realizar esta acción?</p>
            <div class="modal-botones">
                <button onclick="cerrarModal()" class="btn-accion">Cancelar</button>
                <button id="btnConfirmar" class="btn-accion">Confirmar</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin.js"></script>
    <script src="js/admin-usuarios.js"></script>
</body>
</html>
