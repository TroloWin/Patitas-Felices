<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión | Patitas Felices</title>
    <link rel="stylesheet" href="../css/estilos-generales.css" />
    <link rel="stylesheet" href="css/login-styles.css" />
    <style>
        /* Estilos adicionales para mensajes de error */
        .mensaje-error {
            background-color: #f8d7da;
            color: #721c24;
            padding: 12px 15px;
            border-radius: var(--borde-redondo);
            margin-bottom: 20px;
            border: 2px solid #f5c6cb;
            font-size: 0.95rem;
        }
        
        .btn-cargando {
            opacity: 0.7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <nav class="navegacion">
        <div class="contenedor">
            <div class="logo">
                <a href="../index.html">
                    <img src="../assets/images/Logos/Patitas Felices 2.png" alt="Patitas Felices" />
                    <span class="logo-texto">Patitas Felices</span>
                </a>
            </div>
            <div class="enlaces-nav">
                <a href="../index.html" class="enlace">Inicio</a>
                <a href="../adoptar.html" class="enlace">Adoptar</a>
                <a href="../donadores.html" class="enlace">Donadores</a>
                <a href="../nosotros.html" class="enlace">Nosotros</a>
            </div>
        </div>
    </nav>

    <main class="contenedor-formulario">
        <div class="tarjeta-formulario">
            <div class="encabezado-formulario">
                <h1>Iniciar Sesión</h1>
                <p>Ingresa tus credenciales para acceder</p>
            </div>

            <div id="mensajeError" class="mensaje-error" style="display: none;"></div>

            <form class="formulario" id="loginForm">
                <div class="grupo-formulario">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@email.com" required autocomplete="email" />
                </div>

                <div class="grupo-formulario">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
                </div>

                <div class="recordar">
                    <label class="checkbox-container">
                        <input type="checkbox" id="recordarme" />
                        <span class="checkmark"></span>
                        Recordarme
                    </label>
                    <a href="recuperar-password.html" class="link">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn btn-primario btn-bloque" id="btnLogin">
                    Iniciar Sesión
                </button>
            </form>

            <div class="pie-formulario">
                <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <script src="../js/firebase-config.js"></script>
    
    <script>
        const loginForm = document.getElementById('loginForm');
        const btnLogin = document.getElementById('btnLogin');
        const mensajeError = document.getElementById('mensajeError');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        function mostrarError(mensaje) {
            mensajeError.textContent = mensaje;
            mensajeError.style.display = 'block';
            
            setTimeout(() => {
                mensajeError.style.display = 'none';
            }, 5000);
        }

        function limpiarError() {
            mensajeError.style.display = 'none';
            mensajeError.textContent = '';
        }

        function setLoading(loading) {
            if (loading) {
                btnLogin.disabled = true;
                btnLogin.classList.add('btn-cargando');
                btnLogin.textContent = 'Iniciando Sesión';
            } else {
                btnLogin.disabled = false;
                btnLogin.classList.remove('btn-cargando');
                btnLogin.textContent = 'Iniciar Sesión';
            }
        }

        function obtenerMensajeAmigable(error) {
            const mensajes = {
                'auth/user-not-found': 'No encontramos una cuenta con este correo electrónico.',
                'auth/wrong-password': 'Contraseña incorrecta. Inténtalo de nuevo.',
                'auth/invalid-email': 'El formato del correo electrónico no es válido.',
                'auth/user-disabled': 'Esta cuenta ha sido deshabilitada. Contacta al administrador.',
                'auth/too-many-requests': 'Demasiados intentos fallidos. Intenta más tarde.',
                'auth/network-request-failed': 'Error de conexión. Verifica tu conexión a internet.'
            };
            
            if (mensajes[error.code]) {
                return mensajes[error.code];
            }
            
            if (error.message && error.message.includes('INVALID_LOGIN_CREDENTIALS')) {
                return 'Correo o contraseña incorrectos. Verifica tus datos.';
            }
            
            if (error.message && error.message.includes('400')) {
                return 'Correo o contraseña incorrectos. Verifica tus datos.';
            }
            
            return 'Error al iniciar sesión. Intenta de nuevo.';
        }

        emailInput.addEventListener('input', function() {
            if (this.value && !this.value.includes('@')) {
                this.style.borderColor = '#dc3545';
            } else {
                this.style.borderColor = 'var(--color-borde)';
            }
            limpiarError();
        });

        passwordInput.addEventListener('input', function() {
            this.style.borderColor = 'var(--color-borde)';
            limpiarError();
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const recordarme = document.getElementById('recordarme').checked;
            
            if (!email) {
                mostrarError('Por favor, ingresa tu correo electrónico.');
                emailInput.focus();
                return;
            }
            
            if (!password) {
                mostrarError('Por favor, ingresa tu contraseña.');
                passwordInput.focus();
                return;
            }
            
            limpiarError();
            setLoading(true);
            
            try {
                const persistence = recordarme 
                    ? firebase.auth.Auth.Persistence.LOCAL 
                    : firebase.auth.Auth.Persistence.SESSION;
                await auth.setPersistence(persistence);
                
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                const userDoc = await db.collection('usuarios').doc(user.uid).get();
                
                if (!userDoc.exists) {
                    await auth.signOut();
                    mostrarError('Usuario no encontrado en la base de datos.');
                    setLoading(false);
                    return;
                }
                
                const userData = userDoc.data();
                
                if (userData.activo === false) {
                    await auth.signOut();
                    mostrarError('Esta cuenta ha sido desactivada. Contacta al administrador.');
                    setLoading(false);
                    return;
                }
                
                if (userData.esAdmin) {
                    window.location.href = '../admin/index.html';
                } else {
                    window.location.href = '../adoptar.html';
                }
                
            } catch (error) {
                console.error('Error en login:', error);
                
                const mensaje = obtenerMensajeAmigable(error);
                mostrarError(mensaje);
                
                passwordInput.value = '';
                passwordInput.focus();
                setLoading(false);
            }
        });
        
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    const userDoc = await db.collection('usuarios').doc(user.uid).get();
                    if (userDoc.exists) {
                        const userData = userDoc.data();
                        if (userData.esAdmin) {
                            window.location.href = '../admin/index.html';
                        } else {
                            window.location.href = '../adoptar.html';
                        }
                    }
                } catch (error) {
                    console.error('Error al verificar sesión:', error);
                }
            }
        });
    </script>
</body>
</html>
